name = "human-anatomy-snap"
main = "src/index.mjs"
# No public route. The ONLY caller is the Pages project through the `SNAP` service
# binding; a public renderer would let anyone burn this account's metered browser
# minutes. Flip to true (and rely on SNAP_SHARED_SECRET) only to debug it directly.
workers_dev = false
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "a135de78aaa95d36ee634b81267625c6"   # Adrey — pinned so a multi-account box cannot deploy this elsewhere

# Cloudflare Browser Rendering. This is the binding that makes the Worker shape
# necessary: Pages Functions do not take it, so the Pages project calls this Worker
# through a service binding instead.
browser = { binding = "BROWSER" }

# Rendered PNGs, keyed by sha256(build id | size | canonical params). A repeated view
# costs one R2 GET instead of a browser session.
[[r2_buckets]]
binding = "SNAPS"
bucket_name = "human-anatomy-snaps"

# SITE_BUILD is part of the cache key, so a redeploy of the site can never be served a
# picture rendered by the previous build. NOT a secret.
# The CF Access service token (SNAP_CF_ID / SNAP_CF_SECRET) and SNAP_SHARED_SECRET are
# Worker SECRETS set with `wrangler secret put` — never here, never committed.
[vars]
# P4 changes what a plate LOOKS like (render mode, focus framing, ghost anatomy), so every
# cached picture from the previous build is now wrong for the same key. Bumping this is what
# invalidates them. It was still "p2" while the site had shipped P3 and P3r, which means
# pre-P3 pictures were being served for post-P3r views -- deploy.ps1 now fails the build if
# a render-path file changed and this literal did not.
#
# p4 -> p4a: the adversarial-review pass changed what a plate LOOKS like again
# (supersampling on, role opacities recalibrated for coverage), and the guard in deploy.ps1
# caught it on its first real use rather than letting p4-keyed pictures be served for a
# different-looking build.
#
# p4a -> p4a1: the ghost-polish pass. Explore mode no longer applies role opacities at all,
# and every plate is now captured through a 3x supersampled frame instead of the
# compositor's 2x downscale -- both change what a picture LOOKS like, so every p4a-keyed
# PNG in R2 is wrong for this build and must not be served for it.
#
# p4a1 -> l31h: the L31 hotfix reframes every plate. The focus fit now contains the union of
# the primary AND context structures instead of the focus set alone, so the pelvis and femur
# a hamstring hangs off are inside the frame rather than guillotined at the top edge -- the
# camera therefore sits further back and the subject is smaller in EVERY cached picture.
# Measured on the forward-bend plate: touchesTopEdge true -> false at all four viewports,
# subject coverage 5.49% -> 3.48% at 1024x768. Every p4a1-keyed PNG shows the old, clipped
# framing and must not be served for this build.
#
# l31h STAYS l31h through the settle-guard fix that follows it. That change makes the page
# write `data-atlas-settled` on a plate whose camera had already stopped moving; it does not
# move the camera. Verified by re-running the same six scenes and diffing the reported camera
# position and target: identical to the last float. So the pictures keyed l31h are still the
# pictures this build draws, and re-keying would throw the cache away for nothing. The bump
# is required for what a plate LOOKS like — not for every edit under the render path.
# l31h STAYS l31h through L31 v2 as well, and here the reason is load-bearing rather than
# tidy. v2 is a SECOND ENTRY at /v2/; the renderer screenshots `/` in snap mode and never
# visits it. The v2 slice touches app/scene.tsx, app/url-state.ts and app/anatomy.ts, so
# deploy.ps1's tripwire fires — but every one of those edits is behind a field the render path
# does not pass: `insets` (v2 only, and the render branch is checked first), `priority` (absent
# ⇒ the loader keeps its 0..14 cursor), and `data-atlas-scene-ready` (a NEW marker; the
# renderer still waits on `data-atlas-ready` = all 15 chunks). MEASURED, not argued: the six
# control plates were rendered against the live host before the deploy and again after, and
# both the PNG sha256 and the projected subject rect and camera are compared
# (scripts/plate-goldens.mjs, artefacts under .artifacts/L31/v2/goldens/).
#
# AND THE COST OF BEING WRONG THE OTHER WAY IS THE REASON TO BE CAREFUL: Cloudflare Browser
# Rendering minutes are EXHAUSTED on the Adrey account. Bumping SITE_BUILD retires every cached
# PNG, and the account cannot currently re-render a single one — so an unnecessary bump would
# take ChatGPT from "a slightly older picture" to "no picture at all".
# Still l31h through the v2 follow-up (the scene camera applied on a cold link, and the
# barrier's `armedAt` cut-off). Both are v2-path: `applySceneState` lives in app/v2/page.tsx,
# and the loader's new arming lines are no-ops on `/`, where `onSceneReady` is undefined and
# the callback is never invoked. Re-measured against the six control plates after this deploy
# too — same harness, same comparison (PNG sha256 + projected rect + camera).
#
# ONE HONEST CAVEAT ON THE HARNESS: the forward-bend plate's PNG hash is NOT stable run to run
# on an unchanged build (measured: before f6d8f9e6, after 1b7a09da, then f6d8f9e6 again on the
# SAME deployment). It is the only control scene carrying a `ghost`, and alphaHash resolves
# transparency by a stochastic COVERAGE dither. So for that scene the camera and the projected
# subject rect are the evidence, and the hash is noise — recorded here so the next reader does
# not mistake the oscillation for a regression, or trust the hash for a scene where it means
# nothing.
#
# ══ BUMPED TO l31v21a (L31 v2.1a, 2026-09-09) — AND THIS ONE REALLY IS A RENDER-PATH CHANGE ══════
# The three edits above were all argued (and measured) to be v2-path only, which is why the id sat
# at l31h through two deploys. This one is not: `reDriveHash()`'s LEGACY branch now writes `lang`
# and `system` with explicit defaults (workers/snap/src/helpers.mjs), so what a WARM tab draws
# changes. Every PNG rendered on a reused tab before this bump may carry the PREVIOUS request's
# language or system while sitting under a perfectly valid key — the silent failure the helpers
# file's own header warns about. Those entries have to be retired, and a cache version is the only
# mechanism that retires them.
#
# THE COST IS REAL AND IS NOT HIDDEN: per the note above, Browser Rendering minutes are exhausted on
# the Adrey account, so this bump takes cached links from "a slightly older picture" to "no picture
# until the allowance resets". That is the correct trade — a wrong picture in a vocabulary-teaching
# tool is worse than no picture — but it is Adrian's call to reverse if it bites, and there is a
# cheaper alternative on the shelf: salt the key per BRANCH rather than globally
# (`${SITE_BUILD}${params.get('scene') ? '' : '-l31v21a'}` at src/index.mjs:138), which retires only
# the legacy-branch entries this repair can affect and leaves every scene-branch PNG warm. It was
# NOT taken here because it edits the cache-key computation — the highest-hazard line in this
# Worker — in the same commit as six other repairs, and a blanket bump is the mechanism the whole
# design and deploy.ps1's tripwire are built around. Recorded so the option does not have to be
# rediscovered.
#
# `canonical()` is UNCHANGED, so no existing URL's key moves for any reason other than this id;
# that is frozen in test/redrive-hash.test.mjs against a literal expected string.
#
# ── AND IT STAYS l31v21a THROUGH THE TWO CORRECTIVE COMMITS ─────────────────────────────────────
# deploy.ps1's tripwire fires again, because both codex review passes touched files on its
# renderPaths list — `app/scene.tsx` and `app/url-state.ts`. Neither touch can change a plate, and
# that is a claim about specific fields rather than a general reassurance:
#   · app/scene.tsx — the re-armable barrier is reached only through `onSceneReady`, `sceneEpoch`
#     and `requiredIds`. v1 passes NONE of the three, so `sceneReadyCb.current` is undefined and
#     `armIfSatisfied` returns on its first condition. The loader's own cursor and
#     `data-atlas-ready` are untouched.
#   · app/url-state.ts — `clearHash` is opt-in and only `/v2/` passes it; `OWNED_KEYS` exists solely
#     to serve that flag; `stage`/`probe` are written only when the caller supplies them, and v1
#     calls `writeUrlState` with four arguments. The snapshot renderer's own re-drive path
#     (`reDriveHash` -> `location.hash`) is unchanged and its keys are unchanged.
# The bump above is still warranted and still stands: `reDriveHash`'s legacy branch changed what a
# WARM tab draws, and that is what retires the poisoned entries.
#
# MEASURED, not argued: the six control plates were rendered against the live host BEFORE this
# deploy (.artifacts/L31/v21a/live-before/goldens-before.json) and are re-rendered after it, and
# `plate-goldens.mjs compare` now FAILS on a missing scene, an incomplete measurement, any camera or
# projected-bounds change, and on a PNG-size drift over 2% for the one ghost-bearing scene.
#
# ══ L31 v2.1b+c, S1 — BUMPED TO l31v21bc ═══════════════════════════════════════════════════════
# S1 edits `app/scene.tsx`, which is on `deploy.ps1`'s render-path tripwire list, so the deploy
# refuses until this line moves. It is bumped because the guard is right to ask, NOT because a
# plate changed — and the difference is measured rather than argued:
#
#   · Everything S1 touches in the renderer is behind the `studio` PROP, which only `/v2/` at
#     >=1180 passes. `/?snap=1` is v1 and never sets it, so `STUDIO_PADDING`, the zeroed focus
#     lean, G3's whole-body fit and the manual-pose resize rule are all unreachable from a plate.
#   · `studio` is deliberately NOT part of `SceneState`, so it cannot travel inside a scene blob.
#   · The one unconditional change is `__atlasTargets`'s `parts` lane, which is a read-only
#     introspection getter no render path calls.
#   · BASELINED: six control plates captured against the live host FIVE times BEFORE the deploy
#     (.artifacts/L31/v21bc/s1/goldens/) — 60 pairwise comparisons, zero drift, and all six hashes
#     identical to v2.1a's `goldens-after.json` from two days earlier.
#
#   · AND MEASURED AFTER, on 2026-09-12, once this bump was live:
#       compare v21a/live-after/goldens-after.json -> s1/goldens/goldens-s1-after.json
#         => IDENTICAL within tolerance, 6 of 6 required, 0 tolerated notes
#       compare s1/goldens/goldens-s1-before.json -> s1/goldens/goldens-s1-after.json
#         => IDENTICAL within tolerance, 6 of 6 required, 0 tolerated notes
#     The second pair is the stronger one: both sides carry the 768-cell pixel fingerprint, so it is
#     a comparison of the PICTURES rather than of the PNG sizes. Camera, projected bounds and hash
#     all equal on every scene.
#
# An earlier draft of this comment said "then re-compared after" while no after-capture existed on
# disk — a claim in the future tense written in the past tense (stand-in review S1 M4). It was
# softened to BASELINED and is restored here only now that the measurement exists.
#
# ⚠️ THE FIRST RENDER OF EACH PLATE AFTER THIS BUMP IS COLD. Every cached PNG under the old key is
# retired, and Browser Rendering minutes are exhausted on the Adrey account, so the cold path is
# the local one. That is the cost of the bump and it is stated rather than discovered.
# ══ L31 v2.1b+c, S5a (2026-09-13) — BUMPED TO l31v21bc2. A RENDER-PATH EDIT, AND THE ID MOVES ════
#
# `app/scene.tsx` gained `__atlasNav.setPose` — the write twin of the `pose()` reader, needed because
# a scene tab restores a camera pose and `scene.camera` cannot express one (it carries a view, a
# focus set, a padding and an explode amount, none of which say where a reader orbited to). The file
# is in `deploy.ps1`'s `renderPaths`, so the tripwire fires and RC2 applies exactly as written: bump,
# deploy the Worker, and prove the plates unchanged.
#
# ⚠️ I FIRST DECLINED THIS BUMP, AND MY REASON WAS FALSE. I argued the change was plate-invisible by
# inspection (true, and codex agreed across two rounds that it found no path from Worker capture to
# `setPose`) and that a bump would therefore cost more than it bought, because "Browser Rendering
# minutes are EXHAUSTED on the Adrey account" — so retiring the cache would take live links from a
# slightly older picture to NO picture.
#
# That second half was not a measurement. It was this file's own note from the l31v21a era, read as
# if it were still true. The planner refuted it with the instrument that settles it: the post-deploy
# plate goldens rendered **6 of 6 IDENTICAL against the live Worker** after S1 (2026-09-12) and again
# after S4 at 06:40 today (`.artifacts/L31/v21a/live-after-s4/goldens-after.json`). The account
# renders plates. The cost I was protecting against does not exist, so the trade I made was between a
# real risk and an imaginary saving.
#
# THE LESSON IS THE ONE THIS PROJECT KEEPS RELEARNING, arriving in a new place: a comment is a claim,
# not evidence. This file is full of careful measured notes, and I used one of them as a fact about
# TODAY without re-measuring — the same shape as trusting a status line over the server's own log.
# Where a stale note can gate a deploy decision, it has to carry its measurement date, and the reader
# has to check it. Hence the date stamps above and here.
#
# ⚠️ AND THE BUMP IS THE HONEST WAY TO CLEAR THE TRIPWIRE. Touching this file to satisfy the guard's
# mtime comparison without moving the id would have passed the check while doing none of what the
# check exists to cause. The guard is never edited and never worked around.
#
# THE PROOF IS STILL THE GOLDENS, not this paragraph: after the Pages and Worker deploys,
# `plate-goldens.mjs compare` runs against the S4 baseline above and must report every control scene
# IDENTICAL. (Per the caveat further up, the forward-bend plate's PNG hash is stochastic — its camera
# and projected rect are the evidence there.) The first render after this bump is COLD.
# ⚠️ S5a-2 MOVED IT AGAIN, to `l31v21bc3`, and the SECOND bump is not a mistake. `app/scene.tsx` is on
# the `renderPaths` list, and S5a-2 touched it again: OrbitControls' `start` handler now re-emits a
# window event (`atlas-nav-gesture`) so a tab's pending pose restore can yield to a reader's hand.
# `bc2` was committed and NEVER DEPLOYED, so nothing is being retired twice — the guard compares the
# last commit that touched a render path against the last commit that touched THIS file, and the only
# honest way to clear it is to move the id in a commit of its own, after the one it is about.
#
# THE RENDER-PATH CLAIM, again checked rather than asserted: the dispatch fires only from
# OrbitControls' `start`, which is a pointer / touch / wheel gesture. `workers/snap` renders from the
# scene and never touches the controls, so it cannot fire during a plate — and a `dispatchEvent` with
# no listener is a no-op. The goldens after the deploy are what proves it.
# ⚠️ AND ONCE MORE, to `l31v21bc4`: codex round 16 found that a `scene-ready` subscriber could eat the
# next generation's pose restore, and the fix needs the RENDERER to say which generation it drew --
# `onSceneReady(armedAt, drawnEpoch)` in app/scene.tsx, another render-path edit in a round that has
# not deployed anything. Same rule as bc3: the id moves in its own commit, after the commit it is
# about, and neither bc2 nor bc3 was ever served. Plate-invisible for the same reason (the Worker
# renders from the scene and never mounts this callback's consumer); the goldens are the proof.
SITE_BUILD = "l31v21bc5"
