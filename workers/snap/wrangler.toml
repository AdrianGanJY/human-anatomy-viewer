name = "human-anatomy-snap"
main = "src/index.mjs"
# No public route. The ONLY caller is the Pages project through the `SNAP` service
# binding; a public renderer would let anyone burn this account's metered browser
# minutes. Flip to true (and rely on SNAP_SHARED_SECRET) only to debug it directly.
workers_dev = false
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "a135de78aaa95d36ee634b81267625c6"   # Adrey — pinned so a multi-account box cannot deploy this elsewhere

# Cloudflare Browser Rendering. This is the binding that makes the Worker shape
# necessary: Pages Functions do not take it, so the Pages project calls this Worker
# through a service binding instead.
browser = { binding = "BROWSER" }

# Rendered PNGs, keyed by sha256(build id | size | canonical params). A repeated view
# costs one R2 GET instead of a browser session.
[[r2_buckets]]
binding = "SNAPS"
bucket_name = "human-anatomy-snaps"

# SITE_BUILD is part of the cache key, so a redeploy of the site can never be served a
# picture rendered by the previous build. NOT a secret.
# The CF Access service token (SNAP_CF_ID / SNAP_CF_SECRET) and SNAP_SHARED_SECRET are
# Worker SECRETS set with `wrangler secret put` — never here, never committed.
[vars]
# P4 changes what a plate LOOKS like (render mode, focus framing, ghost anatomy), so every
# cached picture from the previous build is now wrong for the same key. Bumping this is what
# invalidates them. It was still "p2" while the site had shipped P3 and P3r, which means
# pre-P3 pictures were being served for post-P3r views -- deploy.ps1 now fails the build if
# a render-path file changed and this literal did not.
#
# p4 -> p4a: the adversarial-review pass changed what a plate LOOKS like again
# (supersampling on, role opacities recalibrated for coverage), and the guard in deploy.ps1
# caught it on its first real use rather than letting p4-keyed pictures be served for a
# different-looking build.
#
# p4a -> p4a1: the ghost-polish pass. Explore mode no longer applies role opacities at all,
# and every plate is now captured through a 3x supersampled frame instead of the
# compositor's 2x downscale -- both change what a picture LOOKS like, so every p4a-keyed
# PNG in R2 is wrong for this build and must not be served for it.
#
# p4a1 -> l31h: the L31 hotfix reframes every plate. The focus fit now contains the union of
# the primary AND context structures instead of the focus set alone, so the pelvis and femur
# a hamstring hangs off are inside the frame rather than guillotined at the top edge -- the
# camera therefore sits further back and the subject is smaller in EVERY cached picture.
# Measured on the forward-bend plate: touchesTopEdge true -> false at all four viewports,
# subject coverage 5.49% -> 3.48% at 1024x768. Every p4a1-keyed PNG shows the old, clipped
# framing and must not be served for this build.
#
# l31h STAYS l31h through the settle-guard fix that follows it. That change makes the page
# write `data-atlas-settled` on a plate whose camera had already stopped moving; it does not
# move the camera. Verified by re-running the same six scenes and diffing the reported camera
# position and target: identical to the last float. So the pictures keyed l31h are still the
# pictures this build draws, and re-keying would throw the cache away for nothing. The bump
# is required for what a plate LOOKS like — not for every edit under the render path.
SITE_BUILD = "l31h"
