name = "human-anatomy-snap"
main = "src/index.mjs"
# No public route. The ONLY caller is the Pages project through the `SNAP` service
# binding; a public renderer would let anyone burn this account's metered browser
# minutes. Flip to true (and rely on SNAP_SHARED_SECRET) only to debug it directly.
workers_dev = false
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "a135de78aaa95d36ee634b81267625c6"   # Adrey — pinned so a multi-account box cannot deploy this elsewhere

# Cloudflare Browser Rendering. This is the binding that makes the Worker shape
# necessary: Pages Functions do not take it, so the Pages project calls this Worker
# through a service binding instead.
browser = { binding = "BROWSER" }

# Rendered PNGs, keyed by sha256(build id | size | canonical params). A repeated view
# costs one R2 GET instead of a browser session.
[[r2_buckets]]
binding = "SNAPS"
bucket_name = "human-anatomy-snaps"

# SITE_BUILD is part of the cache key, so a redeploy of the site can never be served a
# picture rendered by the previous build. NOT a secret.
# The CF Access service token (SNAP_CF_ID / SNAP_CF_SECRET) and SNAP_SHARED_SECRET are
# Worker SECRETS set with `wrangler secret put` — never here, never committed.
[vars]
# P4 changes what a plate LOOKS like (render mode, focus framing, ghost anatomy), so every
# cached picture from the previous build is now wrong for the same key. Bumping this is what
# invalidates them. It was still "p2" while the site had shipped P3 and P3r, which means
# pre-P3 pictures were being served for post-P3r views -- deploy.ps1 now fails the build if
# a render-path file changed and this literal did not.
#
# p4 -> p4a: the adversarial-review pass changed what a plate LOOKS like again
# (supersampling on, role opacities recalibrated for coverage), and the guard in deploy.ps1
# caught it on its first real use rather than letting p4-keyed pictures be served for a
# different-looking build.
#
# p4a -> p4a1: the ghost-polish pass. Explore mode no longer applies role opacities at all,
# and every plate is now captured through a 3x supersampled frame instead of the
# compositor's 2x downscale -- both change what a picture LOOKS like, so every p4a-keyed
# PNG in R2 is wrong for this build and must not be served for it.
#
# p4a1 -> l31h: the L31 hotfix reframes every plate. The focus fit now contains the union of
# the primary AND context structures instead of the focus set alone, so the pelvis and femur
# a hamstring hangs off are inside the frame rather than guillotined at the top edge -- the
# camera therefore sits further back and the subject is smaller in EVERY cached picture.
# Measured on the forward-bend plate: touchesTopEdge true -> false at all four viewports,
# subject coverage 5.49% -> 3.48% at 1024x768. Every p4a1-keyed PNG shows the old, clipped
# framing and must not be served for this build.
#
# l31h STAYS l31h through the settle-guard fix that follows it. That change makes the page
# write `data-atlas-settled` on a plate whose camera had already stopped moving; it does not
# move the camera. Verified by re-running the same six scenes and diffing the reported camera
# position and target: identical to the last float. So the pictures keyed l31h are still the
# pictures this build draws, and re-keying would throw the cache away for nothing. The bump
# is required for what a plate LOOKS like — not for every edit under the render path.
# l31h STAYS l31h through L31 v2 as well, and here the reason is load-bearing rather than
# tidy. v2 is a SECOND ENTRY at /v2/; the renderer screenshots `/` in snap mode and never
# visits it. The v2 slice touches app/scene.tsx, app/url-state.ts and app/anatomy.ts, so
# deploy.ps1's tripwire fires — but every one of those edits is behind a field the render path
# does not pass: `insets` (v2 only, and the render branch is checked first), `priority` (absent
# ⇒ the loader keeps its 0..14 cursor), and `data-atlas-scene-ready` (a NEW marker; the
# renderer still waits on `data-atlas-ready` = all 15 chunks). MEASURED, not argued: the six
# control plates were rendered against the live host before the deploy and again after, and
# both the PNG sha256 and the projected subject rect and camera are compared
# (scripts/plate-goldens.mjs, artefacts under .artifacts/L31/v2/goldens/).
#
# AND THE COST OF BEING WRONG THE OTHER WAY IS THE REASON TO BE CAREFUL: Cloudflare Browser
# Rendering minutes are EXHAUSTED on the Adrey account. Bumping SITE_BUILD retires every cached
# PNG, and the account cannot currently re-render a single one — so an unnecessary bump would
# take ChatGPT from "a slightly older picture" to "no picture at all".
# Still l31h through the v2 follow-up (the scene camera applied on a cold link, and the
# barrier's `armedAt` cut-off). Both are v2-path: `applySceneState` lives in app/v2/page.tsx,
# and the loader's new arming lines are no-ops on `/`, where `onSceneReady` is undefined and
# the callback is never invoked. Re-measured against the six control plates after this deploy
# too — same harness, same comparison (PNG sha256 + projected rect + camera).
#
# ONE HONEST CAVEAT ON THE HARNESS: the forward-bend plate's PNG hash is NOT stable run to run
# on an unchanged build (measured: before f6d8f9e6, after 1b7a09da, then f6d8f9e6 again on the
# SAME deployment). It is the only control scene carrying a `ghost`, and alphaHash resolves
# transparency by a stochastic COVERAGE dither. So for that scene the camera and the projected
# subject rect are the evidence, and the hash is noise — recorded here so the next reader does
# not mistake the oscillation for a regression, or trust the hash for a scene where it means
# nothing.
#
# ══ BUMPED TO l31v21a (L31 v2.1a, 2026-09-09) — AND THIS ONE REALLY IS A RENDER-PATH CHANGE ══════
# The three edits above were all argued (and measured) to be v2-path only, which is why the id sat
# at l31h through two deploys. This one is not: `reDriveHash()`'s LEGACY branch now writes `lang`
# and `system` with explicit defaults (workers/snap/src/helpers.mjs), so what a WARM tab draws
# changes. Every PNG rendered on a reused tab before this bump may carry the PREVIOUS request's
# language or system while sitting under a perfectly valid key — the silent failure the helpers
# file's own header warns about. Those entries have to be retired, and a cache version is the only
# mechanism that retires them.
#
# THE COST IS REAL AND IS NOT HIDDEN: per the note above, Browser Rendering minutes are exhausted on
# the Adrey account, so this bump takes cached links from "a slightly older picture" to "no picture
# until the allowance resets". That is the correct trade — a wrong picture in a vocabulary-teaching
# tool is worse than no picture — but it is Adrian's call to reverse if it bites, and there is a
# cheaper alternative on the shelf: salt the key per BRANCH rather than globally
# (`${SITE_BUILD}${params.get('scene') ? '' : '-l31v21a'}` at src/index.mjs:138), which retires only
# the legacy-branch entries this repair can affect and leaves every scene-branch PNG warm. It was
# NOT taken here because it edits the cache-key computation — the highest-hazard line in this
# Worker — in the same commit as six other repairs, and a blanket bump is the mechanism the whole
# design and deploy.ps1's tripwire are built around. Recorded so the option does not have to be
# rediscovered.
#
# `canonical()` is UNCHANGED, so no existing URL's key moves for any reason other than this id;
# that is frozen in test/redrive-hash.test.mjs against a literal expected string.
SITE_BUILD = "l31v21a"
